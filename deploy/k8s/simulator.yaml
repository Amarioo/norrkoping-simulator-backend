# Norrköping Simulator backend in the k3s cluster, set up like the Airplane Mode backend: Traefik
# ingress, HTTPS from cert-manager (letsencrypt-prod), a nip.io name on the cluster's public address.
#   https://api-norrkoping-simulator.213-66-61-225.nip.io/health
# Apply with: sudo k3s kubectl apply -f deploy/k8s/simulator.yaml
# then run a published build:
#   sudo k3s kubectl -n norrkoping-simulator set image deployment/simulator \
#     simulator=ghcr.io/amarioo/norrkoping-simulator-backend:sha-<commit>
apiVersion: v1
kind: Namespace
metadata:
  name: norrkoping-simulator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: norrkoping-simulator
spec:
  # The cities live in the process's memory: exactly one copy, and the old one stops before the new starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: ghcr.io/amarioo/norrkoping-simulator-backend:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            # The UI's address on Vercel (several separated by commas, no trailing slash).
            - name: ALLOWED_ORIGIN
              value: https://norrkoping-simulator-ui.vercel.app
            # Each visitor's stream is about 1 Mbit/s compressed with the start traffic and up to
            # 5–6 Mbit/s with the heaviest; the limit keeps the home connection and the nodes free.
            - name: MAX_CITIES
              value: "8"
            # The processor limit below is two cores; without this Go would start a thread per core.
            - name: GOMAXPROCS
              value: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: simulator
  namespace: norrkoping-simulator
spec:
  selector:
    app: simulator
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simulator
  namespace: norrkoping-simulator
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api-norrkoping-simulator.213-66-61-225.nip.io]
      secretName: simulator-tls
  rules:
    - host: api-norrkoping-simulator.213-66-61-225.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: simulator
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: simulator
                port:
                  name: http
